          - article [ref=f5e125]:
            - strong [ref=f5e126]: 아침 17~24도·낮 최고 25~33도동해안 중심 비…최대 60㎜ 예상
            - generic [ref=f5e127]:
              - generic [ref=f5e129]:
                - img "[괴산=뉴시스] 서주영 기자 = 지난 7일 충북 괴산군 문광면 문법리 '문광 느티나무 마을숲'을 찾은 주민들이 벤치에 앉아 무더위를 피하며 휴식을 취하고 있다. 국가산림문화자산 1호인 문광 느티나무 마을숲에는 수령"
              - emphasis [ref=f5e130]: "[괴산=뉴시스] 서주영 기자 = 지난 7일 충북 괴산군 문광면 문법리 '문광 느티나무 마을숲'을 찾은 주민들이 벤치에 앉아 무더위를 피하며 휴식을 취하고 있다. 국가산림문화자산 1호인 문광 느티나무 마을숲에는 수령 300~350년의 느티나무 20여그루가 자리하고 있다. (사진=괴산군 제공) 2026.08.10. photo@newsis.com *재판매 및 DB 금지"
            - text: "[서울=뉴시스]신유림 기자 = 수요일인 12일은 아침저녁으로 비교적 선선하겠지만, 낮에는 기온이 33도까지 오르며 무덥겠다. 동해안을 중심으로는 비가 내리겠다.이날 기상청은 \"전국에 가끔 구름이 많겠으나 강원 영동과 경상권 해안은 대체로 흐리겠다\"고 예보했다.최근 이어진 극심한 폭염의 기세는 다소 꺾였지만 낮 동안에는 다시 기온이 크게 오르겠다. 수도권과 충남권, 남부 지방에서는 최고 체감온도가 33도 안팎에 달하는 곳이 있겠다.동해안을 중심으로 비 소식이 있다. 오전부터 강원동해안·산지에, 오후부터 경북동해안·북동산지에 비가 내리겠다.12~13일 예상 강수량은 ▲강원 동해안·산지와 경북 북부 동해안·북동 산지 20~60㎜ ▲경북 남부 동해안과 울릉도·독도 10~40㎜다.본격적인 비가 내리기 전 빗방울이 떨어지는 곳도 있겠다. 12일 새벽부터 아침 사이 강원 동해안·산지, 오전에는 경북 동해안·북동 산지에 0.1㎜ 미만의 빗방울이 예상된다. 부산과 울산에도 오후부터 13일 오전 사이 빗방울이 떨어지는 곳이 있겠다.아침까지 강원 산지에는 동풍에 의한 낮은 구름이 유입되면서 가시거리 200m 미만의 짙은 안개가 끼는 곳이 있겠다. 이슬비가 내리는 곳도 있어 교통안전에 유의해야 한다.이날부터 만조 때 바닷물 높이가 높아져 해안가 저지대 침수와 하수 역류 등에 유의해야겠다.당분간 아침 기온은 평년(최저 21~24도)과 비슷하거나 조금 낮겠고, 낮 기온은 평년(최고 28~32도)과 비슷하겠다.아침 최저기온은 17~24도, 낮 최고기온은 25~33도를 오르내리겠다.주요 지역 아침 최저기온은 서울 23도, 인천 22도, 수원 21도, 춘천 18도, 강릉 21도, 청주 20도, 대전 20도, 전주 24도, 광주 21도, 대구 20도, 부산 22도, 제주 24도다.낮 최고기온은 서울 33도, 인천 33도, 수원 32도, 춘천 30도, 강릉 26도, 청주 32도, 대전 31도, 전주 33도, 광주 33도, 대구 31도, 부산 31도, 제주 30도로 예상된다.미세먼지 농도는 전 권역에서 '좋음' 수준을 보이겠다．"
