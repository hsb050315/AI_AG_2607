                - generic [ref=f86e198]:
                  - paragraph [ref=f86e199]: 안녕하세요! 이번 포스팅은 요즘 제 타임라인을 가득 채운 그 얘기, 바로 오피셜히게단디즘(히게단) 내한 공연 후기예요. 8월 8일부터 9일까지 이틀간 서울 올림픽공원 KSPO DOME에서 진행된 이번 공연은 히게단이 2024년 12월 이후 약 1년 8개월 만에 다시 한국을 찾은 무대였다고 해요.
                  - paragraph [ref=f86e200]: 🎤 이번 투어, 어떤 자리였을까
                  - paragraph [ref=f86e201]: 이번 공연은 'OFFICIAL HIGE DANDISM ASIA TOUR 2026 in SEOUL'이라는 이름으로 진행됐고, 이틀 동안 약 2만 6천 명의 관객이 다녀갔다고 하니 규모부터 남달랐어요. 스탠딩부터 지정석까지 좌석 종류도 다양했고, 팬클럽 선예매부터 일반 예매까지 티켓 경쟁도 꽤 치열했다고 하더라고요.
                  - paragraph [ref=f86e202]: 🎶 세트리스트는 이랬대요 (대략적으로)
                  - paragraph [ref=f86e203]: 정확한 곡 순서까지는 자신 있게 말씀드리긴 조심스럽지만, 이번 무대는 그동안 사랑받아온 대표곡들은 물론 앨범 수록곡, 그리고 최근 발표한 신곡까지 골고루 들려준 구성이었다고 해요. 오랜 팬이라면 익숙한 곡에서 반가움을, 처음 접하는 분들이라면 신곡에서 새로운 매력을 느낄 수 있었을 것 같아요.
                  - paragraph [ref=f86e204]: 💭 왜 이렇게 화제였을까
                  - paragraph [ref=f86e205]: 히게단은 애니메이션 OST나 드라마 주제가로 우리에게 익숙해진 밴드인데, 일본 음악을 잘 모르는 분들도 한 번쯤 멜로디는 들어봤을 정도로 대중적인 인지도를 가지고 있어요. 안정적인 라이브 실력으로 유명한 만큼, 이번 내한도 오랜만에 국내 팬덤의 반응을 제대로 확인한 무대였다는 이야기가 많더라고요.
                  - paragraph [ref=f86e206]: ✏✏️ 마무리하며
                  - paragraph [ref=f86e207]: 아직 직접 다녀오신 분들의 생생한 후기나 영상들이 계속 올라오고 있는데, 보다 보면 또 다음 내한이 기다려지네요. 히게단을 잘 모르셨던 분들도 이번 기회에 이 밴드의 곡들을 한번 찾아 들어보시면 좋을 것 같아요.
                  - paragraph [ref=f86e208]: ※ 이 글은 공식 발표 및 언론 보도를 참고해 정리했으며, 세부 세트리스트나 현장 디테일은 개인/매체별로 조금씩 다르게 전해질 수 있는 점 참고 부탁드려요.
