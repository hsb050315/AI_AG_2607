                  - text: "2026. 8. 11. {\"domainIdOrBlogId\":\"wndhkeodurtk\",\"blogNo\":51623980,\"nickname\":\"쏠킴\",\"profileImage\":\"https://blogpfthumb-phinf.pstatic.net/MjAxODA2MTBfMjQw/MDAxNTI4NTYxMDQ0NTM5.MthISFf95yhefErJRnWl1cuxAcSDVYuhTnui9qSMdJYg.Hfk5o86MTRthHg4DBLmTl-ql6WiOI7oTRJnO_55KopIg.JPEG.wndhkeodurtk/0.jpg?type=s1\",\"blogUrl\":\"https://blog.naver.com/wndhkeodurtk\",\"logNo\":224373904282,\"title\":\"8월 12일부터 달라진다! 오버워치 넥슨 서비스 계정 연동 핵심 정리\",\"postUrl\":\"https://blog.naver.com/wndhkeodurtk/224373904282\",\"briefContents\":\"안녕하세요 쏠킴입니다. 오늘은 8월 12일부터 달라지는 오버워치 넥슨 서비스 계정 연동 핵심 정리를 해드리도록 하겠습니다. 블리자드의 대표 FPS 오버워치가 오는 8월 12일부터 넥슨을 통해 국내 서비스를 시작하게 되었는데요. 기존에 배틀넷이 아니라 게임을 새로운 플랫폼에서 즐길 수 있게 되면서 계정 연결과 각종 혜택까지 받을 수 있는 좋은 기회라고 생각 되기 때문에 꼭 체크해 보시면 좋겠습니다. 8월 12일부터 달라진다! 오버워치 넥슨 서비스 계정 연동 핵심 정리 이번 소식을 보고 오버워치 자체가 넥슨 게임으로 바뀌는 것으로 생각할 수도 있는데요. 핵심은 개발 주체가 변경되는 것이 아니라는 점입니다. 게임 개발과 콘텐츠 제작은 기존처럼 블리자드가 이어가며 넥슨은 국내 퍼블리싱을 비롯해 운영과 현지화, 마케팅과 이벤트 등을 담당합니다. 따라서 영웅 밸런스나 게임의 기본적인 개발 방향까지 넥슨이 별도로 결정하는 구조로 볼 필요는 없습니다. 넥슨 서비스를 이용할 계획이라면 먼저 계정 연결 일정을 체크해 두는 것이 좋습니다. 안내된 일정에 따르면 계정 연동은 7월 7일부터 8월 11일까지 진행되고 이후 8월 12일 넥슨 서비스가 본격적...\",\"sympathyCnt\":15,\"commentCnt\":0,\"addDate\":1786401600000,\"hasThumbnail\":true,\"thumbnails\":[{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTBfMTg3/MDAxNzg2MzM0OTA4MTA5.-Gy_xpsyMf8SEEJ64lJ4mHSSvQI61eVSloNNLy9HEXcg.aHxGiG0biAjAIq1aWHPVU_MmL0hVWILuaaM8YL6o6VYg.PNG/image.png?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTBfMTUg/MDAxNzg2MzM1MDE3OTkz.ow8Sg1TVdgA0E_euoIVHP3oeMpSjgm2KAmR62SOBRBkg.AdytE5EYbB9zOD-H_xcY8YCMpZ8Io38zfYWrqqOffZEg.PNG/image.png?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTBfMjAw/MDAxNzg2MzM0MzQyNTky.n28ALGT_AdjlHS27nbTMST-eUpkUBH1c7dLbUauZ_Mcg.IVoGBUsxZV83hmQB-3SE4ugtCPL8F1pMTb3qF1qu7Wog.PNG/image.png?type=s2\"},{\"videoThumbnail\":false,\"vrthumbn