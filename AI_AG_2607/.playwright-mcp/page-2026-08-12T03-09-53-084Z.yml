                - link "용산 아이파크몰 놀거리, 실시간 용산역 8월 팝업 7곳 오랜만에 친구랑 약속이 생겨서 용산 아이파크몰에 잠깐 들렀는데 안 온 사이에 용산역 팝업들이 새롭게 뭐가 많이 생겼더라고요? 실시간 용산 아이파크몰 놀거리 찾으시는 분들 많으실 거 같아서 참고하시면 좋을 거 같아서 현장에서 직접 본 것들 빠르게 알려드릴게요! 함께보면 좋을 용산 놀거리 🔻 용산 아이파크몰 기본정보 1. 도파민스테이션 첫 돌잔치 용산아이파크몰 들어가는 길목에 바로 보였던 용산 놀거리인데요 전용 앱 깔면 가챠 뽑기를 1회 할 수 있어서 냉큼 해봤답니다. 아... 이거 무슨빵인지 아시나요? 제 생일이 9월이라서 선택하면 돌려서 뽑아주시는데 밤티나는 빵 키링이 나왔어요. 😂 라인업이 되게 많아서 기대했는데 원하던 게 아니라서 살짝 아쉬웠지만, 그래도 키링을 그냥 얻을 수 있어서 나름... 괜찮다고 생각하려고 했어요. 2. 민음사 오늘의 귀여움, 대기 실화일까요? 보신 분들은 후기 알려주세요 여긴 대기가 워낙 길어서 일단 등록부터 해뒀거든요. 근데 오픈 첫날이라 그런지 사람 빠지는 속도가 너무 느려서 결국 취소하고 나왔어요. 😂 만약에 용산 놀거리로 여기 보실 계..." [ref=f75e268] [cursor=pointer]:
