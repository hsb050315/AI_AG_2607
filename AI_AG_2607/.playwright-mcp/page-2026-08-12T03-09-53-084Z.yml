                  - text: "16시간 전 {\"domainIdOrBlogId\":\"i_likeit\",\"blogNo\":104336857,\"nickname\":\"릴리\",\"profileImage\":\"https://blogpfthumb-phinf.pstatic.net/MjAyNjA3MjdfMjgy/MDAxNzg1MTUzMTExNDYw.MkVf0fNHQCjYcLU4p7mwL7ZQDlLf6cSH7MxzrpFnoeIg.uwQKe7UCiiHJChYPVLtYEqGqgBN7KnRW3qRGBHJRliQg.JPEG/profileImage.jpg?type=s1\",\"blogUrl\":\"https://blog.naver.com/i_likeit\",\"logNo\":224375476789,\"title\":\"자유부인 맞이하여 송도 도자기공방 도예공방율에서 만들어본 야나칸 접시\",\"postUrl\":\"https://blog.naver.com/i_likeit/224375476789\",\"briefContents\":\"남편이 오전반차를 쓰고 자몽이를 봐줘서 반나절 자유부인이 되었는데, 정작 자유를 맞이해도 크게 갈데가 없다 ㅎㅎ 친구들은 다 일하고, 멀리 갈 순 없고!! 바로 집앞에 송도 도자기공방이 있어서 기웃거렸던 적이 있었는데 좋은 기회가 되서 예약하고 다녀오게 되었다 ㅎㅎ 도예공방율 주소: 연수구 첨단대로 40 송도 에스파이브시티 B동 216호 영업시간: 11:00 - 21:00 (매주 목요일 휴무) 주차: 건물 내 지하주차장 이용 매장 내부 매장 내부는 넓고 깔끔하다. 밖에서도 유리창 너머로 깔끔한 공방이 인상적이었었는데 핸드빌딩이나 그릇을 꾸밀 수 있는 커다란 작업대 테이블이 있고, 물레도 있어서 물레 체험도 가능하다. 기존에 작업했던 작업물들을 구경하는데도 눈이 즐거웠다. 오랜만에 이런 경험을 해서 그런건지 혼자 있어서 그런건지 알길이 없었음ㅋㅋ... 아무튼 하기 전부터 너무 설레고 기분이 좋았다. 도자기 모양도 다양했지만 색깔도 다양하고 느낌도 너무 다양해서 어떻게 이렇게 만들어지는 지도 너무 신기했다. 아기들이 만든 작품들 넘 귀여움 ㅠㅠ 한쪽 끝에는 도자기를 굽는 가마도 있어서 작업물들을 모아서 한번에 굽는데 말리고 굽고 유약을 바...\",\"sympathyCnt\":127,\"commentCnt\":14,\"addDate\":1786445750574,\"hasThumbnail\":true,\"thumbnails\":[{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMjU2/MDAxNzg2NDQ0ODkzOTgw._cQOmMIMazSDHNid87BA3uV0MpBX_dbLoAw8-ex8q8gg.iRQP25rWMEMKhKyegyGQrFrPwkRZPHvgmtJ-UCe_gR0g.JPEG/output%A3%DF2714674423.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfNDUg/MDAxNzg2NDQzOTY2MzUz.Kgh5MlXKL3SFNEInMcWj_jrb-hTRDm3UTcJYi160Pzog.razzpQwX7gRUHoV7sIYXBYrtnNH24duV4V6rfZhwv7Ug.JPEG/IMG%A3%DF7669.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTcw/MDAxNzg2NDQzOTcwMDUy.Hf7u4Gk0BJvpDVNv-OnxZhk09yKFk-6lA-9H221xUgQg.EzmYTd-SWzIdlA8oWtDJaBOOWrKZ8ZiwS_qe6GRhpYkg.GIF/IMG%A3%DF7670.gif?type=s2\"},{\"videoThumbna