                - 'link "남편이 오전반차를 쓰고 자몽이를 봐줘서 반나절 자유부인이 되었는데, 정작 자유를 맞이해도 크게 갈데가 없다 ㅎㅎ 친구들은 다 일하고, 멀리 갈 순 없고!! 바로 집앞에 송도 도자기공방이 있어서 기웃거렸던 적이 있었는데 좋은 기회가 되서 예약하고 다녀오게 되었다 ㅎㅎ 도예공방율 주소: 연수구 첨단대로 40 송도 에스파이브시티 B동 216호 영업시간: 11:00 - 21:00 (매주 목요일 휴무) 주차: 건물 내 지하주차장 이용 매장 내부 매장 내부는 넓고 깔끔하다. 밖에서도 유리창 너머로 깔끔한 공방이 인상적이었었는데 핸드빌딩이나 그릇을 꾸밀 수 있는 커다란 작업대 테이블이 있고, 물레도 있어서 물레 체험도 가능하다. 기존에 작업했던 작업물들을 구경하는데도 눈이 즐거웠다. 오랜만에 이런 경험을 해서 그런건지 혼자 있어서 그런건지 알길이 없었음ㅋㅋ... 아무튼 하기 전부터 너무 설레고 기분이 좋았다. 도자기 모양도 다양했지만 색깔도 다양하고 느낌도 너무 다양해서 어떻게 이렇게 만들어지는 지도 너무 신기했다. 아기들이 만든 작품들 넘 귀여움 ㅠㅠ 한쪽 끝에는 도자기를 굽는 가마도 있어서 작업물들을 모아서 한번에 굽는데 말리고 굽고 유약을 바..." [ref=f75e343] [cursor=pointer]':
