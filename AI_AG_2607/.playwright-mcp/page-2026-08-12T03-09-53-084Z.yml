                  - text: "11시간 전 {\"domainIdOrBlogId\":\"ptj0969\",\"blogNo\":33762963,\"nickname\":\"에레키맨\",\"profileImage\":\"https://blogpfthumb-phinf.pstatic.net/20100707_186/ptj0969_1278496591719_U2oPH6_jpg/%BF%A1%B7%B9%C5%B0.jpg?type=s1\",\"blogUrl\":\"https://blog.naver.com/ptj0969\",\"logNo\":224375716637,\"title\":\"가면라이더 젯츠 어이없는 강화폼 캡셈 소멸\",\"postUrl\":\"https://blog.naver.com/ptj0969/224375716637\",\"briefContents\":\"아니 진짜로 궁금한게 대체 왜 익스드림이나 듀얼메어 안 쓴걸까요 가면라이더 젯츠 최신화에서 아마 보시는 분들에게도 제일 어이터지는 장면이였던 이번화의 장면 맞아요 뭐 리스크가 주어진 것도 아닌데 그냥 강화폼 일부러 안 쓰다가 다 소멸당했습니다. 배리어로도 도저히 막아낼수 없어 가면라이더 젯츠가 다음으로 꺼낸 폼은 어째서인지 피지캠 임팩트 그래요 기본폼으로 체인지를 해서 오블리비언에게 마구잡이로 덤벼들기 시작합니다 너무나도 당연하게도 기본폼 따위로 오블리비언에게 일절 데미지조차도 주는건 불가능했고 전부 사라져버려 에너지볼 한방을 맞더니 바쿠는 그대로 날아가버리고 맙니다 그런데 여기서 그냥 날아간 수준이 아니라 저거 맞는 바람에 모든 강화폼 캡셈들이 소멸당했어요 대놓고 보여지는 듀얼메어부터 잘 보시면 이나즈마도 사라지고 있는 모습이 보입니다 사실 익스드림도 함께 사라질 뻔하다가 겨우 바쿠가 달려들어서 소멸하는 것을 막아낸 덕분에 무사히 건진건데 말 그대로 진짜 한순간에 모든 강화폼들이 다 사라질 뻔한겁니다 아니 정확힌 익스드림 빼고 다 사라졌어요 여기서 이번화의 이해가 되지 않는 점이 생각하게 되죠 진...\",\"sympathyCnt\":41,\"commentCnt\":11,\"addDate\":1786463657243,\"hasThumbnail\":true,\"thumbnails\":[{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTA5/MDAxNzg2NDQxNDE0MzIx.coFu00XyhaMz7GHcN0GByJ2-ePbn8hklUlfAy-H2NeEg.EZ0sSagYgoVNOBTjNsgPN5lFywMhq8-0y7qHZIXnIdgg.JPEG/_2026_08_09_19_18_13_559.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTk2/MDAxNzg2NDQxMzg2Nzc0.2rKD_X49KN5da7L_gi2IHFgjkRls9EeQWPiNxoRHCVAg.bGmU4qBIjowEXZ2AJ5lbH-GBj2EqXVvexk5ehbv-yDog.JPEG/_2026_08_09_19_17_48_9.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMjc2/MDAxNzg2NDQxMzg3OTI2.O30vskw9tO6ZrrPv8-3XG00q7-IYjEZC_cvI3wmMWDwg.oJqWeOqfFp1ppHcH1sap18KwmuksylrTMB1GQMjBVzQg.JPEG/_2026_08_09_19_17_50_728.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfNjIg/MDAxNzg