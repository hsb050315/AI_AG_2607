                  - text: "19시간 전 {\"domainIdOrBlogId\":\"sodasujm\",\"blogNo\":17264487,\"nickname\":\"알로마미\",\"profileImage\":\"https://blogpfthumb-phinf.pstatic.net/MjAyNjA2MDdfMjA2/MDAxNzgwODQzNjA0MjI5.DtAurItQghqXrpw7PVkSveBbZuRZi0KCW_Ty_X52s00g.1pphY5_43n6ZErRmcGp-UtSf8_hpwg35YaZ6BvIrOrUg.JPEG/profileImage.jpg?type=s1\",\"blogUrl\":\"https://blog.naver.com/sodasujm\",\"logNo\":224375263614,\"title\":\"델리 5단 심조절 레트로 연필깎이 내돈내산 후기\",\"postUrl\":\"https://blog.naver.com/sodasujm/224375263614\",\"briefContents\":\"안녕하세요. 아이 연필깎이 찾다가 발견한 델리 5단 심조절 레트로 연필깎이를 소개해 보겠습니다. 처음에는 그냥 가격이 좀 저렴하고 디자인이 예뻐서 눈길이 갔는데, 찾아보니 생각보다 기능이 알차서 바로 구매하게 되었어요. 요즘 고학년이 된 아이가 학교나 학원에서 점점 노트 필기가 많아지면서 집에서 편하게 사용할 수 있는 제대로 된 연필깎이를 찾다는 발견하게 된 제품인데요. 가장 먼저 눈에 들어 오는건 역시나 디자인! 델리 5단 심조절 연필깎이 우드컬러 델리 5단심조절 연필깎이는 일반적인 흔한 플라스틱 디자인의 연필깎이가 아니라 레트로 스피커를 연상시키는 감각적인 사각형 디자인이라 책상 위나 거실 어디에 두어도 문구용품이라기보단 하나의 데스크 소품같은 느낌이 더 들었어요. 나뭇결이 살아 있는 우드컬러는 차분하고 따뜻한 분위기를 연출해 아이 책상뿐 아니라 어른 책상에 놓아도 꽤 감각적인것 분위기를 낼것 같네요. 크기도 아주 크지도 작지도 않게 적당! 이 제품이 가장 마음에 들었던건 5단 심조절 기능이에요. 실제 사용해 보면 1단은 비교적 뭉퉁하고 굵게/5단으로 갈수록 가늘고 뾰족하게 깎이는게 아주 마음에 들더라구요. 공부용...\",\"sympathyCnt\":123,\"commentCnt\":14,\"addDate\":1786432244452,\"hasThumbnail\":true,\"thumbnails\":[{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTg3/MDAxNzg2NDIzMTM5MjI1.odsyb9OPErG9gNvhKUoTPjT4pAOLJQQRE-Qob6AXaMQg.zmQo0wR4HXz8eh1Visn41SvWOdvZ2F5dkfYuHeN4ewAg.JPEG/900_1786423138486.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTA3/MDAxNzg2NDIzMDEzMDAy.CSZaZEcBjH2Ml8T6SwMrS7q90s6_k-irTy6jelkDnQ8g.UmsePenXKjWVI3xUIf2Nl4_N-CD4gFFFxmKEbJEQh9wg.JPEG/900_1786423012382.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfNjUg/MDAxNzg2NDIzMDMwNDAy.nWI6uLaAZ1fRMn-qivtZAwdL47zQK60ous52Mpjcc4Ig.VY-fMgJ_TnZWXv88JpYF6XFLY8EiwrkHpigAmTzkBRYg.JPEG/900_20260811_120930.jpg?type=s2\"},{\"videoThumbnail\":false,\"vr