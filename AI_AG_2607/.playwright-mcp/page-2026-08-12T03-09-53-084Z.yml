                - 'link "모든 사진은 아이폰16pro 기본 카메라로만 촬영합니다. 색감 보정은 lightroom 어플을 사용하며 보통 대비 / 밝기 / 온도를 사진 분위기에 맞게 보정하기 때문에 정확히 보정법에 대해 말씀드리기 어렵습니다. 블로그에 올리는 사진은 원본인 사진들도 많고 사진마다 보정하는 부분이 아예 다릅니다. 댓글로 보정법 질문하셔도 이외에 더 자세하게 알려드릴게 없습니다🥺 상업적인 사진 사용 / 2차 무단 수정 / 재업로드를 금지합니다. #에이미베이크샵 빨리 야외에서 다시 커피 마실 수 있는 날씨가 오길 #캐리마켓팝업 더현대에서 캐리마켓 팝업 했는데 타이다이 몬치치 판매한다길래 바로 예약 다행히 재고 많아서 뒷타임이었는데도 살 수 있었다 솜사탕 색깔 너무 귀여워 친구랑 타이다이 몬치치 하나씩 💞 몬치치 사진 찍고 있으니까 일본분들이 지나가면서 어디서 사냐고해서 알려드리고 카와이카와이 하시길래 멧챠 카와이...! 라고했더니 웃으심 ㅎㅎ 하늘색 미닛뮤트에 달았는데 너무 귀엽지 더현대 온김에 후그 팝업 들리기 사놓고 아직 개시도 못함 자수 박힌거 보고 언제 그냥 지나칠 수 있을까 이번엔 우롱마차 흑임자로 마셔봤는데 넘 별로였다 ... 리클라..." [ref=f75e293] [cursor=pointer]':
