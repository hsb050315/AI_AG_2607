                  - text: "12시간 전 {\"domainIdOrBlogId\":\"ptj0969\",\"blogNo\":33762963,\"nickname\":\"에레키맨\",\"profileImage\":\"https://blogpfthumb-phinf.pstatic.net/20100707_186/ptj0969_1278496591719_U2oPH6_jpg/%BF%A1%B7%B9%C5%B0.jpg?type=s1\",\"blogUrl\":\"https://blog.naver.com/ptj0969\",\"logNo\":224375679677,\"title\":\"가면라이더 젯츠 오블리비언이 강해진 이유\",\"postUrl\":\"https://blog.naver.com/ptj0969/224375679677\",\"briefContents\":\"주인공이 히로인 구한 짓이 최종보스 버프 먹여버린 대단한 전개 가면라이더 젯츠 최신화에서 현재 최종보스로서 유력한 존재인 오블리비언 고어 나이트메어 얘가 저번보다 왜 이렇게 강해진건지 일단 설명을 본인이 해주기는 합니다. 사실 왜인지는 몰라도 바쿠가 이번화 내내 굳이 기본폼으로만 싸우는지라 압도적으로 두들겨 맞는데도 불구하고 오블리비언이 얼마나 강한지에 대해서 어필이 되었는지는 모르겠습니다 암튼 오블리비언 피셜로 일단 자신이 태어난 이유는 네무가 자신이 태어나지 말았어야 했다는 그런 생각을 꾸준히 가지는 바람에 생겨난 존재라고 이야기를 합니다 그런 네무의 자책 속에서 태어난 존재가 바로 모든걸 지워버리는 악몽 오블리비언이라는 것 그리고 남들의 꿈을 응원하더라도 자신은 꿈을 가지면 안된다는 생각을 하게 되었답니다 그러나 문제는 가면라이더 젯츠인 바쿠와 만나면서부터 시작되었는데 바쿠가 현실의 네무를 찾아내주었고 꿈이 아닌 현실에서 살아갈수 있다라는 꿈을 심어주었답니다 현실을 살아가면서 모두의 꿈을 이루어주고 싶다는 네무의 새로운 꿈이 생긴건 좋은데 문제는 그 꿈에서 태어난 오블리비언에게 악영향은 커...\",\"sympathyCnt\":34,\"commentCnt\":3,\"addDate\":1786460407585,\"hasThumbnail\":true,\"thumbnails\":[{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTQ3/MDAxNzg2NDQxMTc1MTMy.qZHLP3DzDuRQi7C42Xvl4rR7yDfMFy_2n-q3QBQBSBEg.KH50A1Lbvf4y5luqY20t5NUZgb1p7ZUnYpb48xcH-gQg.JPEG/_2026_08_09_19_17_26_12.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMjky/MDAxNzg2NDQxMTMxNjU0.Ow0OvESdxDZNLwVprbSHidUrLxHBpJ5Y5tJQ4hQ67A8g.0m51QiVl5Dpv_2gJipiI3Anv69Z204NaBL-9cBbQPNkg.JPEG/_2026_08_09_19_16_48_646.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfNzMg/MDAxNzg2NDQxMTMyNzE4.2v-XkuIg6EVxKfZaUPILYb69yQk_hRSZK7X-ZeJ3X9Ig.gypGh-Nfny2_14oTGCx84qfC1Hbx4lZIoJy1_tpFY_kg.JPEG/_2026_08_09_19_16_49_140.jpg?type=s2\"},{\"videoThumbnail\":false,\"vrthumbnail\":false,\"url\":\"https://blogthumb.pstatic.net/MjAyNjA4MTFfMTcx/MDAxNzg2ND