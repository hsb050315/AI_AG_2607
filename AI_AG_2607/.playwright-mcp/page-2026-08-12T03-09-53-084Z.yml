                - link "7월 세번째 - 8월 첫번째 일상☀️ 최애 샐러드 냠냠😋 냉장고에 방토랑 사과가 떨어지면 마음이 불안하다 ㅎㅎ 📍 해물솥밥모랑 부모님 댁에 들렀던 날엔 엄마빠가 바깥 음식 먹자고 하셔서 외출 솥밥 사랑합니다 역시 갓 지은 밥 최고👍 난 맛있게 먹었는데, 아빠랑 남편은 양념장과 국이 아쉬웠다는 평 📍 오디와이 커피 OdiY coffee 식후 커피 마시러 왔지요 내가 좋아하는 오디와이 커피 늘 2층에만 앉다가 처음으로 1층에 자리를 잡았다 오르락 내리락하지 않아도 되니 편하긴 했는데 산뷰 밭뷰를 감상할 수 없다는 단점 아이스크림 얹은 브라우니도 함께 주문 나중에 우유크림소금빵도 추가로 주문했다가 넘 맛있어서 더 사려고 했더니 그 사이 품절됐더라 그나저나 커피 가격이 오른 건가? 맛있게 먹었으니 이해하기로 했지만 위치 생각하면 비싼 건 맞다 그래도 또 올 예정😂 📍 올더프 카페 투어는 계속 됩니다 남편이랑 신상 카페에 놀러왔다 올더프는 반려 동물 동반 가능 카페 맞은편에 앉아 있는 댕댕이 훔쳐보려고 선택한 자리이다 힐끔힐끔🐶🤎 커피 맛 괜찮았고, 가구나 조명을 포함한 인테리어도 나쁘진 않았지만 창밖 뷰가 매우 아쉽 밖..." [ref=f75e193] [cursor=pointer]:
