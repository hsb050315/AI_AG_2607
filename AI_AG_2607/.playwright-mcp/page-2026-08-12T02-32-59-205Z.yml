          - article [ref=f15e120]:
            - generic [ref=f15e121]: 미세먼지 농도는 전 권역에서 ‘좋음’ 수준
            - text: 수요일인 12일은 전국에 가끔 구름이 많은 가운데 강원 동해안과 경북 동해안을 중심으로 비가 내리겠다.
            - table [ref=f15e122]:
              - rowgroup [ref=f15e123]:
                - row [ref=f15e124]:
                  - cell [ref=f15e125]
                - row [ref=f15e129]:
                  - cell "궂은 날씨를 보인 지난 9일 강원 속초 해수욕장에 높은 파도로 인한 수영 금지 안내문이 게시돼 있다. 연합뉴스" [ref=f15e130]
            - text: 오전에 강원 동해안·산지에 비가 내리기 시작해 오후부터는 경북 동해안·북동 산지로 강우가 확대되겠다. 예상 강수량은 12~14일 사흘간 강원 동해안·산지와 경북 동해안·북동 산지 20~60㎜다. 부산·울산에도 오후부터 내일 새벽 사이 0.1㎜ 미만의 빗방울이 떨어지는 곳이 있겠다. 당분간 아침 기온은 평년과 비슷하거나 조금 낮고, 낮 기온은 평년과 비슷하겠다. 일부 경기도에 폭염특보가 발효된 가운데 당분간 수도권과 충남권, 남부지방을 중심으로 최고 체감온도가 33도 안팎으로 오르겠다. 이날 오전 5시 현재 기온은 서울 21.9도, 인천 23.1도, 수원 22.0도, 춘천 17.0도, 강릉 20.0도, 청주 21.2도, 대전 20.3도, 전주 20.1도, 광주 21.5도, 제주 23.9도, 대구 19.3도, 부산 22.6도, 울산 22.3도, 창원 22.5도 등이다. 낮 최고기온은 서울 33도, 인천 33도, 수원 32도, 춘천 30도, 강릉 26도, 청주 32도, 대전 31도, 전주 33도, 광주 33도, 대구 31도, 부산 31도, 제주 30도 등으로 예상된다. 바다의 물결은 동해 앞바다에서 1.0~3.5m, 서해 앞바다에서 0.5~1.0m, 남해 앞바다에서 0.5~2.5m로 일겠다. 안쪽 먼바다(해안선에서 약 200㎞ 내의 먼바다)의 파고는 동해 1.5~4.0m, 서해 0.5~3.0m, 남해 1.0~3.5m로 예상된다. 미세먼지 농도는 전 권역에서 ‘좋음’ 수준을 보이겠다.
