        - generic [ref=f45e111]:
          - article [ref=f45e115]: "지난주에 워낙 지독한 폭염을 겪어서일까요.요 며칠 더위는 그나마 견딜 만하게 느껴집니다.아침저녁으로는 제법 바람도 불고, 숨이 턱턱 막히던 습한 열기도 한결 덜해졌는데요.서쪽에 남아 있던 폭염특보도 일부 경기를 제외하면 대부분 해제됐고, 열대야특보도 모두 사라졌습니다.그래도 한낮에는 30도를 웃도는 여름 더위가 이어지는 만큼, 온열질환 대비는 계속 신경 써주셔야겠습니다.오늘 전국 하늘 대체로 맑은 가운데 구름만 지나겠지만, 동해안은 비바람이 불겠는데요.태풍 찬홈이 열대저압부로 약해져 동해로 들어오면서 동풍이 강해지기 때문입니다.비는 오전에 강원 동해안부터 시작해, 오후면 경북 동해안으로 확대되겠고요.모레까지 강수량은 최대 60mm 예상되고, 내일은 가뭄에 단비가 절실한 경남에도 최대 40㎜의 비가 내리겠습니다.이 동풍 때문에 동서 간의 기온차도 크게 벌어지겠습니다.서쪽은 볕이 내리쬐면서 한낮에 서울 32도, 대전 31도까지 오르겠지만, 동풍이 맞닿는 강릉은 25도에 머물겠고요.남부지방은 전주 33도, 광주 32도, 울산은 29도가 예상됩니다.연일 바다도 요란합니다.동해상에는 강한 바람이 불면서 물결이 최고 4m까지 높게 일겠고요.해안가에는 너울까지 강하게 밀려오겠습니다.당분간 내륙 곳곳에 소나기가 지나겠고요.광복절 연휴에는 전국의 하늘빛이 흐릴 전망입니다.지금까지 날씨였습니다.(이소연 기상캐스터)연합뉴스TV 기사문의 및 제보 : 카톡/라인 jebo23"
