          - article [ref=f35e121]:
            - strong [ref=f35e122]: 12일 아침 최저 17~24도 전망대부분 지역 폭염·열대야 벗어나강원·경북 동해안엔 비 예보
            - generic [ref=f35e123]:
              - generic [ref=f35e125]:
                - img "사진=연합뉴스"
              - emphasis [ref=f35e126]: 사진=연합뉴스
            - text: 수요일인 12일 전국 대부분 지역이 폭염과 열대야에서 벗어나겠다. 제13호 태풍 돌핀의 영향으로 한반도 주변 기압계가 바뀌면서 최근 이어진 '극한폭염'도 한풀 꺾일 전망이다.기상청에 따르면 12일 전국의 아침 최저기온은 17~24도, 낮 최고기온은 25~33도로 예상된다. 밤 최저기온이 25도 이상인 열대야와 일 최고기온이 33도 이상인 폭염일 기준을 고려하면 대부분 지역에서 폭염과 열대야가 나타나지 않을 것으로 보인다.주요 도시의 예상 최저·최고기온은 서울 22도·32도, 인천 22도·33도, 대전 19도·31도, 광주 21도·32도, 대구 20도·31도, 울산 22도·29도, 부산 23도·31도다.체감온도를 기준으로 발령하는 폭염주의보도 여주동남부·서부, 김포, 화성, 파주남부 등 경기 일부를 제외하고 모두 해제됐다. 폭염주의보는 일 최고 체감온도가 33도 이상인 상태가 이틀 이상 이어질 것으로 예상될 때 내려진다.기온이 내려가는 것은 제13호 태풍 돌핀이 우리나라 남쪽을 지나면서 주변 기압계가 달라졌기 때문이다. 티베트고기압과 북태평양고기압이 한반도를 이중으로 덮었던 상황이 해소됐다.우리나라 북동쪽에 자리한 저기압에서 내려온 건조한 공기가 고기압을 형성한 점도 영향을 미쳤다. 이 고기압 가장자리를 따라 비교적 차고 건조한 북동풍이 유입되면서 극한 무더위에서 벗어나게 됐다.13일 아침 최저기온은 19~24도, 낮 최고기온은 27~34도로 예보됐다. 14일은 각각 20~24도와 27~34도, 15일은 21~25도와 28~33도로 예상된다.북동풍의 영향으로 강원동해안·산지에는 12일 오전부터 비가 내리겠다. 경북동해안·북동산지는 오후부터 비가 시작되겠고, 13일 오후에는 경남해안·동부내륙으로 확대될 전망이다.예상 강수량은 강원동해안·산지와 경북북부동해안·북동산지 20~60㎜다. 경북남부동해안과 부산·울산·경남남해안·경남동부내륙·울릉도·독도에는 10~40㎜의 비가 예상된다.
