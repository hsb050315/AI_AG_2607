                - generic [ref=f333e85]: ▲오피셜히게단디즘(사진출처= PONY CANYON (ⓒTAKAHIRO TAKINAMI))
              - text: 일본 인기 밴드 오피셜히게단디즘(Official髭男dism·이하 히게단)이 내한 공연을 성공적으로 마쳤다.
              - paragraph
              - paragraph [ref=f333e86]: 히게단은 지난 8~9일 서울 올림픽공원 KSPO DOME에서 'OFFICIAL HIGE DANDISM ASIA TOUR 2026' 서울 공연을 개최하고 팬들과 만났다. 2024년 12월 이후 약 1년 8개월 만에 한국을 찾은 히게단은 싱가포르, 타이베이, 방콕으로 이어지는 아시아 투어의 포문을 서울에서 열었다.
              - paragraph [ref=f333e87]: 이번 내한은 예매 단계부터 뜨거운 열기를 입증했다. 티켓 오픈 당시 동시 접속자 수 8만 명이 몰리며 순식간에 전석 매진을 기록했고, 추가 오픈된 시야제한석까지 모두 동이 나 양일간 2만6000명의 관객이 가득찼다.
