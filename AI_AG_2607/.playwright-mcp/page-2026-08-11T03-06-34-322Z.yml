              - paragraph [ref=f333e91]: 히게단은 'Same Blue'로 공연의 포문을 연 뒤 '숙명', '50%', 'Laughter', 'Fire Ground', 'TATTOO', 'Mixed Nuts', 'Stardust', 'Stand By You' 등 대표 히트곡과 최신곡을 넘나드는 알찬 세트리스트를 선보였다. 브라스, 퍼커션, 코러스 등 풍성한 서포트 세션이 가미된 입체적인 라이브 사운드 위로 관객들의 폭발적인 떼창과 응원이 어우러졌다.
              - paragraph [ref=f333e92]: 특히 2018년 발표한 첫 정규 앨범 수록곡 'Takaga I Love You'까지 관객들의 떼창이 이어지며, 타이틀곡뿐만 아니라 앨범 전곡을 깊이 있게 소비하는 굳건한 국내 팬덤의 화력을 증명했다.
              - paragraph [ref=f333e93]: 후지하라는 "2년 전 이곳에서 느낀 열기가 정말 뜨거웠고, 우리를 기다려 주는 분들이 있다는 사실에 빨리 돌아오고 싶었다"라며 "다시 찾아와 여러분과 특별한 추억을 만들 수 있어 정말 기쁘다"고 감격을 전했다.
              - paragraph [ref=f333e94]: 마지막 곡 'Stand By You'로 관객과 하나 된 울림을 만들어낸 히게단은 "앞으로도 이 넷이서 좋아하는 음악을 많이 만들어 전달하겠다. 음악의 최종 목적지는 작품이 아닌 여러분의 귀와 마음"이라는 메시지를 남기며 대단원의 막을 내렸다.
