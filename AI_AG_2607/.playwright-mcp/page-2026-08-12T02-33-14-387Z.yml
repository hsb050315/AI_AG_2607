            - text: "(서울=연합뉴스) 정지수 기자 = 수요일인 12일은 동해안을 중심으로 비가 내리는 곳이 있겠다. 오전부터 강원 동해안·산지에, 오후부터는 경북 동해안·북동 산지에 비가 내리겠다. 부산·울산에는 오후부터 0.1㎜ 미만으로 빗방울이 떨어지는 곳이 있겠다. 예상 강수량은 12∼13일 이틀간 강원 동해안·산지와 경북 북부 동해안·북동 산지에 20∼60㎜, 경북 남부 동해안에 10∼40㎜다. 아침 최저 기온은 17∼24도, 낮 최고 기온은 25∼33도로 예보됐다. 미세먼지 농도는 전국이 '좋음'으로 예상된다. 바다의 물결은 동해 앞바다에서 1.0∼3.5m, 서해 앞바다에서 0.5∼1.0m, 남해 앞바다에서 0.5∼2.5m로 일겠다. 안쪽 먼바다(해안선에서 약 200㎞ 내의 먼바다)의 파고는 동해 1.5∼4.0m, 서해 0.5∼3.0m, 남해 1.0∼3.5m로 예측된다. 다음은 12일 지역별 날씨 전망.[오전, 오후](최저∼최고기온) <오전, 오후 강수 확률> ▲ 서울 : [맑음, 맑음] (22∼32) <0, 0> ▲ 인천 : [맑음, 맑음] (22∼33) <0, 0> ▲ 수원 : [맑음, 맑음] (21∼32) <0, 0> ▲ 춘천 : [맑음, 맑음] (19∼29) <0, 0> ▲ 강릉 : [흐리고 한때 비, 흐리고 비] (21∼25) <60, 80> ▲ 청주 : [맑음, 맑음] (20∼32) <0, 0> ▲ 대전 : [맑음, 맑음] (19∼31) <0, 10> ▲ 세종 : [맑음, 맑음] (18∼31) <0, 0> ▲ 전주 : [맑음, 맑음] (22∼33) <0, 0> ▲ 광주 : [맑음, 맑음] (21∼32) <0, 0> ▲ 대구 : [맑음, 구름많음] (20∼31) <10, 20> ▲ 부산 : [맑음, 구름많음] (23∼31) <10, 20> ▲ 울산 : [구름많음, 구름많음] (22∼29) <20, 20> ▲ 창원 : [맑음, 맑음] (22∼31) <10, 10> ▲ 제주 : [맑음, 맑음] (24∼29) <10, 10>※ 이 기사는 인공지능(AI) 기술을 활용해 제작되었습니다. 인공지능이 쓴 초고와 기상청 데이터 등을 토대로 취재 기자가 최종 기사를 완성했으며 데스킹을 거쳤습니다. 기사의 원 데이터인 기상청 기상예보는 웹사이트(https://www.weather.go.kr)에서도 확인할 수 있습니다."
