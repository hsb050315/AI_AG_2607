                    - paragraph [ref=f261e241]: "[스타데일리뉴스=천설화 기자] 일본 대표 밴드 오피셜히게단디즘이 서울 KSPO DOME에서 단독 공연을 개최하며 1년 8개월 만의 내한 일정을 마쳤다."
                    - paragraph [ref=f261e242]: 지난 8일과 9일 양일간 열린 'OFFICIAL HIGE DANDISM ASIA TOUR 2026' 서울 공연은 시야제한석까지 전석 매진을 기록하며 약 2만 6000명의 관객을 동원했다.
                    - paragraph [ref=f261e243]: 공연에서 히게단은 'Same Blue'를 시작으로 '숙명', 'Mixed Nuts', 'Stand By You' 등 주요 대표곡과 수록곡을 망라한 세트리스트를 선보였다. 브라스, 퍼커션, 코러스 등 서포트 멤버들과 함께 완성도 높은 밴드 사운드를 구축했으며, 화려한 조명과 특수효과를 더해 현장의 몰입도를 높였다.
                    - paragraph [ref=f261e244]: 멤버들은 노랫말에 한국어 표현을 더하거나 관객들과 직접 소통하며 한국 팬들과 교감을 이어갔다. 보컬 후지하라 사토시는 현장을 찾아준 팬들에게 감사를 표하며, 좋은 음악과 라이브로 다시 서울을 찾겠다는 뜻을 내비쳤다.
                    - paragraph [ref=f261e245]: 한편 이번 서울 공연의 전체 세트리스트는 각종 음원 서비스를 통해 플레이리스트로 제공된다.
