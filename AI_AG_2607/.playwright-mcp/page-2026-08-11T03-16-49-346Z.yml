                - paragraph [ref=f505e430]: Canva will keep track of your designs and your account to make sure you’re not breaking this License or any of our Terms. This might include monitoring downloads and Exports, retaining details of your Canva Designs and tracking abuse of your username and password. If you *do* break this license, we may suspend or terminate your account without notice.
                - paragraph [ref=f505e431]: If your account is terminated for violating this license or any abuse of a username or password, you will lose all rights to Content and Canva designs and must immediately delete all Content and Canva designs acquired from Canva, and forfeit all fees paid
                - paragraph [ref=f505e432]: You can terminate your Content license by destroying the Content and Canva Design, along with any copies or archives of it or accompanying materials (if applicable), and no longer using the Canva Design for any purpose. Canva can terminate these Content licenses without advance notice if you fail to comply with any of its terms. If that happens, you must immediately (i) cease using the Content and any Canva Designs containing the Content for any purpose; (ii) destroy or delete all copies and archives of the Content and any Canva Designs containing the Content or accompanying materials; and (iii) if requested, confirm to Canva in writing that you have complied with these requirements.
              - generic [ref=f505e434]:
                - heading "11. Infringement claims" [level=3] [ref=f505e435]
                - paragraph [ref=f505e436]: If you find out – from Canva or somewhere else – that there’s a claim of infringement of another’s right for which Canva might be liable, you have to stop using the Content immediately, at your own expense. This applies whether the claim is threatened, potential or actual. You also have to immediately delete or remove the Content from your premises, computer systems and storage (electronic or physical); ensure that your clients, printers or ISPs do likewise; and let Canva know as soon as possible by emailing copyright@canva.com.
