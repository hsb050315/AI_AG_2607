                  - listitem [ref=f505e113]:
                    - generic [ref=f505e114]: "If you create a Canva Design that includes Content from multiple Content categories, the most restrictive category applies to the entire design. The Content categories, from most to least restrictive, are: Education Content, Branded Content, Pro Content, and Free Content."
