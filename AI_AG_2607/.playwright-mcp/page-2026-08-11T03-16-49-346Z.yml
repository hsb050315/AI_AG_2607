              - generic [ref=f505e158]:
                - heading "3. Pro Content License (aka One Design Use License)" [level=3] [ref=f505e159]
                - paragraph [ref=f505e160]: Under the terms of this agreement, we grant you a perpetual, non-exclusive, non-transferable (subject to section 4A below), worldwide license to use Pro Content or Pro Template in a single Canva Design, for the Permitted Uses defined in sections 5 and 7 below (Pro Content License or One Design Use License). You may not copy, download or distribute the Pro Content as a standalone item.
                - paragraph [ref=f505e161]
                - heading "3A. AI-Generated Content" [level=3] [ref=f505e162]
                - paragraph [ref=f505e163]: Canva makes available certain Content that has been generated by Canva using generative AI tools (AI-Generated Content). This AI-Generated Content will be marked as either Free Content or Pro Content, and the source information for that Content will indicate that such Content has been generated using AI. You may use AI-Generated Content in the same way you may use Free Content or Pro Content, as applicable, under this Agreement.
              - generic [ref=f505e165]:
                - heading "4. Getting a license" [level=3] [ref=f505e166]
                - paragraph [ref=f505e167]: "A license is issued to you when you Export a Canva Design, for each piece of Content contained in your Design. Free Content licenses are issued at no cost. Pro Content Licenses are issued:"
