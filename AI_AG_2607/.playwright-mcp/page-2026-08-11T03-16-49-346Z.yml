                - 'heading "5C: Permitted Uses for Education Content" [level=3] [ref=f505e264]'
                - paragraph [ref=f505e265]: Canva may provide Education Content in either the Free or the Pro library. Education Content will be labelled with a badge titled “Resource”. Education Content is made available for educational, non-commercial use only, and may not be used for any commercial or promotional purpose.
                - 'heading "5D: Disney Content on Canva" [level=3] [ref=f505e266]'
                - paragraph [ref=f505e267]: Beginning on 18 October 2024, Canva will be providing a series of editable Disney-themed templates (“Disney Templates”) and Disney-themed stickers and other elements (“Disney Elements”) incorporating Disney copyrighted works, trademarks, and other intellectual property (“Disney Content”) to Canva users with Pro, Canva Education and Canva for Nonprofit accounts in certain territories for Digital Use and Print Use, as set out below.
                - paragraph [ref=f505e268]: Digital Use
                - paragraph [ref=f505e269]: As at 18 October 2024, Disney Templates and Disney Elements may be used for digital purposes by Canva users with Pro, Canva Education and Canva for Nonprofit accounts in all countries where Canva is available for access, excluding Belarus.
                - paragraph [ref=f505e270]: The Disney Templates and the Disney Elements are for your personal or educational use only and may not be used for any commercial purpose. You may not use these Disney Templates or the Disney Elements in any way that suggests that Disney or any of its affiliates supports, certifies, or otherwise endorses you, your business, or any other person or place. You may not use the Disney Templates or Disney Elements in any way that suggests that you, your business, or any other person or place are affiliated with Disney or any of its affiliates. You are not permitted to remove any copyright notice found on Disney Content or works incorporating Disney Content provided by Canva. You may not use the Disney Templates or the Disney Elements to create merchandise except as authorized under “Print Use” below.
                - paragraph [ref=f505e271]: Print Use
                - paragraph [ref=f505e272]: As at 18 October 2024, Disney Templates and Disney Elements may be used to create printed merchandise for personal or educational purposes only by Canva users with Pro, Canva Education and Canva for Nonprofit accounts located in the United States. This will be limited to certain print products. You may only create print products via the Service. Print products made using the Disney Templates and Disney Elements may not be used for any commercial purpose.
                - paragraph [ref=f505e273]: "Additional things to note:"
                - paragraph [ref=f505e274]: 1.Disney Elements may only be used within Disney Templates.
                - paragraph [ref=f505e275]: 2.Any and all use of the Disney Templates and Disney Elements by Canva users, including any personalisation, is subject at all times to the terms of this Content License Agreement, and Canva’s Acceptable Use Policy.
                - paragraph [ref=f505e276]: 3.In using the Disney Templates and Disney Elements, Canva users are not permitted to create Disney Derivative Works. If you create a Disney Derivative Work, you hereby agree to assign to Disney all rights in the Disney Derivative Work you create and you will not have any rights in the Disney Derivative Work yourself.
                - list [ref=f505e277]:
                  - listitem [ref=f505e278]:
                    - generic [ref=f505e279]: A “Disney Derivative Work” means any design element (including, without limitation, text and graphics) that is derived or adapted from Disney Content, but does not include Separate Design Elements.
                  - listitem [ref=f505e282]:
                    - generic [ref=f505e283]: “Separate Design Elements” are separate, distinct design elements that are made available in the Canva library (other than the Disney Content) or separate, distinct, and copyrightable design elements that are originally created by you or otherwise owned by or licensed to you and that are not in any way derived or adapted from the Disney Content.
                - paragraph [ref=f505e286]: For the avoidance of doubt, your assignment of any Disney Derivative Works that you create to Disney shall not be deemed to grant to Disney any ownership rights in any Separate Design Elements in your Design.
                - paragraph [ref=f505e287]: 4.To the extent the Disney specific terms in this Part 5D conflict with the general Canva Content License Agreement terms, the Disney specific terms in this Part 5D control any and all use of the Disney Templates, Disney Elements and/or Disney Content provided on Canva.
                - paragraph [ref=f505e288]: 5.Canva may remove the Disney Templates, Disney Elements, and/or Disney Content from the Service at any time at its discretion.
                - paragraph [ref=f505e289]: 6.In this Part 5D, “Disney” means Buena Vista Books, Inc. or its designee.
