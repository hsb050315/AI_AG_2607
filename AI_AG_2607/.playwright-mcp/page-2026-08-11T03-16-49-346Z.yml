                - paragraph [ref=f505e170]: Each Pro Content License allows you to use the Content in one Canva Design, so you must pay to obtain a new license each time you wish to use the same piece of Content in a new Design (including a Design that has been Magic Resized). If you have a subscription, then a new license is automatically issued to you each time you Export a new Design containing that Content.
