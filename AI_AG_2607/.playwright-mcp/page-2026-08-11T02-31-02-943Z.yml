              - generic [ref=f52e120]:
                - img "생성형 AI 이미지"
              - emphasis [ref=f52e121]: 생성형 AI 이미지
            - text: 인공지능(AI) 음성 기술이 오디오북 시장의 성장을 이끌고 있는 가운데 AI학습에 따른 성우 목소리 권리 보호 문제가 대두하고 있다.10일 시장조사기관 리서치앤드마켓에 따르면 글로벌 오디오북 시장 규모는 2026년 1133억달러(약 157조원)에서 2032년 2784억달러로 연평균 약 16% 성장할 전망이다. AI의 등장으로 오디오북 제작 방식은 급변하고 있다. 사람이 녹음하던 방식에 비해 제작비와 시간을 대폭 줄일 수 있게 되면서 수익성이 낮아 오디오북으로 제작되기 어려웠던 절판 도서나 소규모 콘텐츠까지 오디오북화가 확산되고 있다. 번역·다국어 낭독 등에도 AI 음성이 활용되면서 제작·유통 전반의 효율이 높아지는 추세다.문제는 AI 음성을 학습시키는 과정에서 원본 음성에 대한 권리 침해 논란이 불거지고 있다는 점이다. 미국에서는 전문 성우와 언론인 등이 구글을 상대로 집단소송을 제기했다. 구글이 수천 시간에 달하는 전문 성우 녹음을 무단으로 수집해 AI 학습에 활용했다는 이유에서다. 자신의 목소리가 동의 없이 복제돼 AI 음성으로 재생산됐다는 것이 이들의 주장이다.국내 오디오북 시장도 성장세가 뚜렷하다. 밀리의서재, 윌라 등 주요 플랫폼이 AI가 책 전체를 낭독하는 완독형 서비스를 잇달아 선보이고 있다.한국출판문화산업진흥원은 국내 오디오북 시장 규모가 2019년 약 171억원에서 2024년 1080억원 규모로 커질 것으로 내다봤다. 시장조사기관 보나파이드 리서치는 보고서 '한국 오디오북 시장 개요, 2030'에서 국내 오디오북 시장이 2030년까지 3억1000만달러(약 4300억원) 이상 규모에 이를 것으로 전망했다.다만 빠른 성장세 만큼 국내에서도 권리 보호 문제가 제기될 가능성이 커졌다. AI 음성 기술이 오디오북 제작에 본격 도입되면서, 국내에서도 성우 목소리의 무단 학습·복제를 둘러싼 권리 문제가 현안으로 부상했다.정부는 제도 마련을 추진 중이다. 문화체육관광부는 AI 학습과 무단 복제를 방지하기 위한 표준계약서 마련을 추진 중이다. 사업자가 성우의 음성 실연을 AI 학습·활용 목적으로 복제·변형·저장할 때의 합의 기준을 담는 방식이다. 나아가 AI 저작권 전반을 아우르는 표준계약서 제정도 논의되고 있다.저작권위원회는 “AI 음성 기술이 오디오북의 생산성과 접근성을 높이는 성장 동력인 것은 분명하다”면서도 “안정적인 시장 확대를 위해서는 음성 제공자의 사전 동의와 보상, AI 음성 표시, 학습 데이터와 복제 음성의 사용 범위를 명확히 하는 제도 마련이 필요하다”고 진단했다.
